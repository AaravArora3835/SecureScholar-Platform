<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Module 2 Quiz — Phishing Defense | SecureScholar</title>
  <link rel="icon" type="image/png" href="../images/favicon.png">
  
  <style>
    :root {
      --bg: #0f1724;
      --card: #0b1220;
      --text: #e6eef6;
      --muted: #9aa4b2;
      --accent: #2ea3ff;
      --radius: 12px;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: Inter, system-ui, -apple-system, sans-serif;
      background: linear-gradient(180deg, #071022 0%, #0b1726 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem;
    }
    
    .container {
      max-width: 700px;
      margin: 0 auto;
    }
    
    .quiz-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    
    .quiz-header h1 {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }
    
    .quiz-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 2rem;
      box-shadow: 0 6px 20px rgba(2, 6, 23, 0.6);
    }
    
    #question-counter {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 1rem;
    }
    
    #quiz-question {
      font-size: 1.2rem;
      margin-bottom: 1.5rem;
      line-height: 1.6;
    }
    
    #quiz-options {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
    
    .quiz-option {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 1rem;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 1rem;
    }
    
    .quiz-option:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: var(--accent);
    }
    
    .quiz-option.selected {
      background: rgba(46, 163, 255, 0.15);
      border-color: var(--accent);
      font-weight: 600;
    }
    
    #next-question {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 0.9rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s ease;
    }
    
    #next-question:hover:not(:disabled) {
      background: #1e8fd6;
      transform: translateY(-2px);
    }
    
    #next-question:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    
    .back-link {
      display: block;
      text-align: center;
      margin-top: 2rem;
      color: var(--muted);
      text-decoration: none;
    }
    
    .back-link:hover {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="quiz-header">
      <h1>🎯 Module 2 Quiz</h1>
      <p style="color: var(--muted);">Phishing Defense — Question Navigator</p>
    </div>
    
    <div class="quiz-card">
      <div id="question-counter">Question 1 of 3</div>
      <div id="quiz-question">Loading question...</div>
      <div id="quiz-options"></div>
      <button id="next-question">Next Question →</button>
    </div>
    
    <a href="module2.html" class="back-link">← Back to Module 2</a>
  </div>
  
  <script src="../js/module2-quiz.js"></script>
</body>
</html>
